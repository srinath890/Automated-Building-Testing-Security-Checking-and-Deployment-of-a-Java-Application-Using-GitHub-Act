# This workflow will build a Java project with Maven

name: Java CI

on:
  push:
    branches: [ "main" ]

  pull_request:
    branches: [ "main" ]

jobs:

  build:
    runs-on: self-hosted

    steps:

    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Build with mvn
      run: mvn clean compile


  security-check:
    runs-on: self-hosted
    needs: build

    steps:

    - uses: actions/checkout@v4

    # Setup Java for Maven
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    # Download Maven dependencies first
    - name: Resolve Maven dependencies
      run: mvn dependency:resolve

    # Install Trivy
    - name: Trivy Installation
      run: |
        sudo apt-get update
        sudo apt-get install -y wget gnupg

        wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | \
        gpg --dearmor | \
        sudo tee /usr/share/keyrings/trivy.gpg > /dev/null

        echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | \
        sudo tee /etc/apt/sources.list.d/trivy.list > /dev/null

        sudo apt-get update
        sudo apt-get install -y trivy

    # Trivy vulnerability scan
    - name: Trivy Fs Scan
      run: trivy fs --scanners vuln --format json -o fs-report.json .

    # Install Gitleaks
    - name: Gitleaks Installation
      run: sudo apt-get install -y gitleaks

    # Gitleaks secret scan
    - name: Gitleaks Code Scan
      run: gitleaks detect --source . --report-path gitleaks-report.json --report-format json

  test:
    runs-on: self-hosted
    needs: security-check

    steps:

    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: unit test
      run: mvn test  

  sonar_test:
    runs-on: self-hosted
    needs: test

    steps:

    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Build project
      run: mvn package  

    - uses: actions/checkout@v6
      with:
        # Disabling shallow clones is recommended for improving the relevancy of reporting
        fetch-depth: 0
    - name: SonarQube Scan
      uses: SonarSource/sonarqube-scan-action@v8.2.1 # Ex: v4.1.0 or sha1, See the latest version at https://github.com/marketplace/actions/official-sonarqube-scan
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}   
        SONAR_HOST_URL: ${{vars.SONAR_HOST_URL}}     

    - name: SonarQube Quality Gate check
        id: sonarqube-quality-gate-check
        uses: sonarsource/sonarqube-quality-gate-action@master
        with:
          pollingTimeoutSec: 600
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL  }} #OPTIONAL     
