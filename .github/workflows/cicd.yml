# This workflow will build a Java project with Ant
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-ant

name: Java CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    - name: Build with mvn
      run: mvn compile


  security-check:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Trivy Fs Scan
      run:  |
          
        sudo apt-get install wget gnupg
        wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null -y
        echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee -a /etc/apt/sources.list.d/trivy.list -y
        sudo apt-get update -y
        sudo apt-get install trivy -y

        

    - name: trivy fs scan     
      run: trivy fs --format table -o fs-report.json .

    - name: Gitleaks installiation
      run: sudo apt install gitleaks -y

    - name: gitleaks code scan
      run: gitleaks detect source .  -r gitleaks-report.json -f json     
